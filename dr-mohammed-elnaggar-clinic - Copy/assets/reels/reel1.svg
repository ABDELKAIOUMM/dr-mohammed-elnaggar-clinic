<svg xmlns="http://www.w3.org/2000/svg" width="405" height="720" viewBox="0 0 405 720">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(217,119,6,0.25)"/>
      <stop offset="100%" stop-color="rgba(217,119,6,0)"/>
    </radialGradient>
    <linearGradient id="teeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#d4c5a0"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(217,119,6,0.4)"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="405" height="720" fill="url(#bg1)"/>
  <rect width="405" height="720" fill="url(#glow1)"/>
  <!-- Decorative circles -->
  <circle cx="60" cy="120" r="180" fill="rgba(217,119,6,0.04)"/>
  <circle cx="350" cy="600" r="150" fill="rgba(217,119,6,0.03)"/>
  <!-- Tooth icon (simplified) -->
  <g transform="translate(202,250) scale(1.2)" filter="url(#shadow1)">
    <path d="M-30,-60 C-30,-85 30,-85 30,-60 C35,-40 40,-10 30,30 C25,55 20,80 12,95 C8,103 -8,103 -12,95 C-20,80 -25,55 -30,30 C-40,-10 -35,-40 -30,-60Z" fill="url(#teeth)" opacity="0.9"/>
    <path d="M-8,95 C-5,105 5,105 8,95" fill="none" stroke="#c9b88a" stroke-width="1.5"/>
    <path d="M-15,-30 Q0,-20 15,-30" fill="none" stroke="rgba(180,160,100,0.3)" stroke-width="1"/>
  </g>
  <!-- Sparkle effects -->
  <circle cx="280" cy="200" r="3" fill="#d97706" opacity="0.7"/>
  <circle cx="120" cy="350" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="300" cy="380" r="2.5" fill="#d97706" opacity="0.6"/>
  <!-- Play button -->
  <circle cx="202" cy="440" r="36" fill="rgba(217,119,6,0.85)" filter="url(#shadow1)"/>
  <polygon points="190,422 190,458 220,440" fill="white"/>
  <!-- Text -->
  <text x="202" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" opacity="0.9">نصيحة طبية</text>
  <text x="202" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d97706" opacity="0.8">١</text>
  <!-- Bottom gradient bar -->
  <rect x="0" y="670" width="405" height="50" fill="rgba(0,0,0,0.5)"/>
  <text x="202" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">اضغط للمشاهدة</text>
  <!-- Replace with: assets/reels/reel1.jpg -->
</svg>